document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

px solid #d9d4c9;background:linear-gradient(#efebe3 1px,transparent 1px) 0 0/100% 110px\">\n          <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"12\">\n            <div sc-camel-on-mouse-enter=\"{{ b.hover }}\" sc-camel-on-click=\"{{ b.hover }}\" style=\"flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px;cursor:pointer;opacity:{{ b.op }}\">\n              <div style=\"flex:1;max-width:18px;height:{{ b.incH }};background:oklch(0.6 0.11 160);border-radius:3px 3px 0 0\"><\u002Fdiv>\n              <div style=\"flex:1;max-width:18px;height:{{ b.expH }};background:oklch(0.66 0.11 45);border-radius:3px 3px 0 0\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:{{ barGap }}\">\n          <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"12\">\n            <div style=\"flex:1;min-width:0;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#8a8478;overflow:hidden;white-space:nowrap\">{{ b.short }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:#fffdf9;border:1px solid #e6e1d7;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px\">\n    <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:baseline\">\n      <h2 style=\"margin:0;font-size:17px;font-weight:600\">Net cash flow<\u002Fh2>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6b665c\">Cumulative {{ cumNet }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:10px\">\n      <div style=\"min-width:40px\"><\u002Fdiv>\n      <div sc-camel-on-mouse-leave=\"{{ clearHover }}\" style=\"flex:1;min-width:0;height:160px;display:flex;gap:{{ barGap }};position:relative\">\n        <div style=\"position:absolute;left:0;right:0;top:50%;border-top:1px solid #cfc9bd\"><\u002Fdiv>\n        <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"12\">\n          <div sc-camel-on-mouse-enter=\"{{ b.hover }}\" sc-camel-on-click=\"{{ b.hover }}\" style=\"flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;cursor:pointer;opacity:{{ b.op }}\">\n            <div style=\"height:50%;width:100%;display:flex;align-items:flex-end;justify-content:center\">\n              <div style=\"width:70%;max-width:26px;height:{{ b.posH }};background:#1d1b17;border-radius:3px 3px 0 0\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"height:50%;width:100%;display:flex;align-items:flex-start;justify-content:center\">\n              <div style=\"width:70%;max-width:26px;height:{{ b.negH }};background:oklch(0.62 0.14 30);border-radius:0 0 3px 3px\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:22px\">\n    <section style=\"background:#fffdf9;border:1px solid #e6e1d7;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px\">\n      <h2 style=\"margin:0;font-size:17px;font-weight:600\">Where the money goes<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <sc-for list=\"{{ breakdown }}\" as=\"c\" hint-placeholder-count=\"6\">\n          <button sc-camel-on-click=\"{{ c.select }}\" style=\"border:0;background:none;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:#1d1b17\">\n            <div style=\"display:flex;justify-content:space-between;gap:10px;font-size:13px;width:100%\">\n              <span style=\"font-weight:500\">{{ c.name }}<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;color:#4a463e\">{{ c.value }} <span style=\"color:#9a9488\">· {{ c.pct }}<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"height:8px;width:100%;background:#efebe3;border-radius:4px;overflow:hidden\">\n              <div style=\"height:100%;width:{{ c.w }};background:{{ c.color }};border-radius:4px\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <sc-if value=\"{{ hasPropSplit }}\" hint-placeholder-val=\"{{ true }}\">\n      <section style=\"background:#fffdf9;border:1px solid #e6e1d7;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px\">\n        <h2 style=\"margin:0;font-size:17px;font-weight:600\">By property<\u002Fh2>\n        <div style=\"display:flex;flex-direction:column\">\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:8px;font-size:11px;color:#8a8478;text-transform:uppercase;letter-spacing:.06em;padding-bottom:8px;border-bottom:1px solid #e6e1d7\">\n            <span>Property<\u002Fspan><span style=\"text-align:right\">Revenue<\u002Fspan><span style=\"text-align:right\">Expenses<\u002Fspan><span style=\"text-align:right\">Net<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ propSplit }}\" as=\"p\" hint-placeholder-count=\"2\">\n            <div style=\"display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:8px;padding:14px 0;border-bottom:1px solid #efebe3;font-size:14px;align-items:baseline\">\n              <span style=\"font-weight:500\">{{ p.name }}<\u002Fspan>\n              <span style=\"text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13px\">{{ p.inc }}<\u002Fspan>\n              <span style=\"text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13px\">{{ p.exp }}<\u002Fspan>\n              <span style=\"text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;color:{{ p.netColor }}\">{{ p.net }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-size:12px;color:#8a8478;line-height:1.5\">Uncategorized transactions only appear under All properties.<\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showTx }}\" hint-placeholder-val=\"{{ false }}\">\n<section style=\"background:#fffdf9;border:1px solid #e6e1d7;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px\">\n  <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:baseline\">\n    <div style=\"display:flex;align-items:baseline;gap:10px;flex-wrap:wrap\">\n      <h2 style=\"margin:0;font-size:17px;font-weight:600\">Transactions<\u002Fh2>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6b665c\">{{ txCount }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n      <button sc-camel-on-click=\"{{ exportFiltered }}\" style=\"white-space:nowrap;border:1px solid #e0dbd1;background:#fffdf9;color:#1d1b17;border-radius:999px;padding:7px 14px;font-size:12px;cursor:pointer\" style-hover=\"border-color:#1d1b17\">Download shown (CSV)<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ exportAll }}\" style=\"white-space:nowrap;border:0;background:#1d1b17;color:#f5f3ee;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:500;cursor:pointer\" style-hover=\"background:#3a3730\">Download all {{ txCountAll }} (CSV)<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center\">\n    <input value=\"{{ search }}\" sc-camel-on-change=\"{{ onSearch }}\" placeholder=\"Search description or category\" style=\"flex:1 1 220px;min-width:0;border:1px solid #e0dbd1;border-radius:8px;padding:9px 12px;font-size:14px;background:#fff;color:#1d1b17;outline:none\">\n    <sc-raw-select value=\"{{ txCat }}\" sc-camel-on-change=\"{{ onCat }}\" style=\"border:1px solid #e0dbd1;border-radius:8px;padding:9px 10px;font-size:13px;background:#fff;color:#1d1b17\">\n      <sc-for list=\"{{ txCatOptions }}\" as=\"o\"><option value=\"{{ o.c }}\">{{ o.c }}<\u002Foption><\u002Fsc-for>\n    <\u002Fsc-raw-select>\n    <div style=\"display:flex;flex-wrap:wrap;gap:4px\">\n      <sc-for list=\"{{ txTypes }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ t.select }}\" style=\"border:1px solid {{ t.border }};border-radius:8px;padding:8px 11px;font-size:12px;cursor:pointer;white-space:nowrap;background:{{ t.bg }};color:{{ t.fg }}\">{{ t.name }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column\">\n    <sc-for list=\"{{ txRows }}\" as=\"t\" hint-placeholder-count=\"8\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:12px 0;border-bottom:1px solid #efebe3\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8a8478;width:92px\">{{ t.date }}<\u002Fspan>\n        <div style=\"flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:3px\">\n          <span style=\"font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis\">{{ t.desc }}<\u002Fspan>\n          <sc-if value=\"{{ t.hasFull }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#4a463e;word-break:break-word\">{{ t.full }}<\u002Fspan>\n          <\u002Fsc-if>\n          <span style=\"font-size:12px;color:#6b665c\">{{ t.prop }} <span style=\"color:#9a9488\">· {{ t.meta }}<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ t.notDetail }}\" hint-placeholder-val=\"{{ true }}\">\n          <span style=\"font-size:12px;padding:3px 9px;border-radius:999px;background:{{ t.catBg }};color:#4a463e\">{{ t.cat }}<\u002Fspan>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ t.isDetail }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:3px\">\n            <sc-if value=\"{{ t.notNew }}\" hint-placeholder-val=\"{{ true }}\">\n              <sc-raw-select value=\"{{ t.pick }}\" sc-camel-on-change=\"{{ t.onPick }}\" style=\"border:{{ t.selBorder }};border-radius:999px;padding:4px 8px;font-size:12px;background:#fff;color:#1d1b17;cursor:pointer\">\n                <sc-for list=\"{{ t.opts }}\" as=\"o\"><option value=\"{{ o.v }}\">{{ o.l }}<\u002Foption><\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ t.isNew }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;gap:4px;align-items:center\">\n                <input sc-camel-auto-focus=\"{{ true }}\" value=\"{{ t.newText }}\" sc-camel-on-change=\"{{ t.onNewText }}\" sc-camel-on-key-down=\"{{ t.onNewKey }}\" placeholder=\"Category name\" style=\"width:130px;border:1px solid #cfc9bd;border-radius:999px;padding:4px 10px;font-size:12px;background:#fff;color:#1d1b17;outline:none\">\n                <button sc-camel-on-click=\"{{ t.saveNew }}\" style=\"border:0;background:#1d1b17;color:#f5f3ee;border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer\">Save<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ t.cancelNew }}\" style=\"border:0;background:none;color:#6b665c;padding:5px 4px;font-size:12px;cursor:pointer\">Cancel<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <span style=\"font-size:10px;color:#8a8478\">{{ t.hint }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;min-width:96px;text-align:right;color:{{ t.color }}\">{{ t.amount }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <sc-if value=\"{{ hasMore }}\" hint-placeholder-val=\"{{ false }}\">\n    <button sc-camel-on-click=\"{{ showMore }}\" style=\"align-self:center;border:1px solid #e0dbd1;background:#fffdf9;border-radius:999px;padding:8px 18px;font-size:13px;cursor:pointer;color:#1d1b17\">Show more<\u002Fbutton>\n  <\u002Fsc-if>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showTax }}\" hint-placeholder-val=\"{{ false }}\">\n<section style=\"background:#fffdf9;border:1px solid #e6e1d7;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px\">\n  <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center\">\n    <div style=\"display:flex;flex-direction:column;gap:4px\">\n      <h2 style=\"margin:0;font-size:17px;font-weight:600\">Tax summary · {{ taxYear }}<\u002Fh2>\n      <span style=\"font-size:12px;color:#6b665c\">Grouped by Schedule E line, calendar year, all properties<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:4px\">\n      <sc-for list=\"{{ taxYears }}\" as=\"y\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ y.select }}\" style=\"border:1px solid {{ y.border }};border-radius:8px;padding:6px 11px;font-size:12px;font-family:'IBM Plex Mono',monospace;cursor:pointer;background:{{ y.bg }};color:{{ y.fg }}\">{{ y.name }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"overflow-x:auto;overflow-y:hidden\">\n    <div style=\"min-width:560px;padding-right:2px;display:flex;flex-direction:column\">\n      <div style=\"display:flex;gap:12px;font-size:11px;color:#8a8478;text-transform:uppercase;letter-spacing:.06em;padding-bottom:8px;border-bottom:1px solid #e6e1d7\">\n        <span style=\"width:34px\">Line<\u002Fspan><span style=\"flex:2\">Item<\u002Fspan>\n        <sc-for list=\"{{ taxProps }}\" as=\"p\"><span style=\"flex:1;text-align:right\">{{ p.p }}<\u002Fspan><\u002Fsc-for>\n        <span style=\"flex:1;text-align:right\">Total<\u002Fspan>\n      <\u002Fdiv>\n      <sc-for list=\"{{ taxLines }}\" as=\"l\" hint-placeholder-count=\"7\">\n        <div style=\"display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #efebe3;font-size:14px;font-weight:{{ l.bold }}\">\n          <span style=\"width:34px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8a8478\">{{ l.line }}<\u002Fspan>\n          <span style=\"flex:2\">{{ l.label }}<\u002Fspan>\n          <sc-for list=\"{{ l.cols }}\" as=\"c\"><span style=\"flex:1;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13px\">{{ c.v }}<\u002Fspan><\u002Fsc-for>\n          <span style=\"flex:1;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500\">{{ l.total }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"display:flex;gap:12px;padding:14px 0;font-size:14px;font-weight:600\">\n        <span style=\"width:34px\"><\u002Fspan><span style=\"flex:2\">Net (before depreciation)<\u002Fspan>\n        <sc-for list=\"{{ taxTotals }}\" as=\"c\"><span style=\"flex:1;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13px\">{{ c.v }}<\u002Fspan><\u002Fsc-for>\n        <span style=\"flex:1;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13px\">{{ taxNet }}<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{ hasCap }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;gap:12px;padding:12px 0;margin-top:6px;border-top:1px dashed #cfc9bd;font-size:14px\">\n          <span style=\"width:34px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8a8478\">4562<\u002Fspan>\n          <span style=\"flex:2;display:flex;flex-direction:column;gap:2px\"><span>Capital improvements (depreciate, not a line 19 expense)<\u002Fspan><span style=\"font-size:11px;color:#8a8478\">{{ capCats }}<\u002Fspan><\u002Fspan>\n          <sc-for list=\"{{ capCols }}\" as=\"c\"><span style=\"flex:1;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13px;color:#6b665c\">{{ c.v }}<\u002Fspan><\u002Fsc-for>\n          <span style=\"flex:1;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13px;color:#6b665c\">{{ capTotal }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font-size:12px;color:#6b665c;line-height:1.6;max-width:720px;text-wrap:pretty\">Mortgage shows full payments. Only the interest portion is deductible on line 12, so use Form 1098 for that figure. Capital improvements are left out of the net and listed separately. They're depreciated over time (Form 4562), and the depreciation goes on line 18. Depreciation isn't calculated here. Uncategorized transactions are left out. Check these numbers with your tax preparer.<\u002Fp>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showData }}\" hint-placeholder-val=\"{{ false }}\">\n<section style=\"background:#fffdf9;border:1px solid #e6e1d7;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:18px;max-width:760px\">\n  <div style=\"display:flex;flex-direction:column;gap:6px\">\n    <h2 style=\"margin:0;font-size:17px;font-weight:600\">Connect your Tiller sheets<\u002Fh2>\n    <p style=\"margin:0;font-size:13px;color:#4a463e;line-height:1.6;text-wrap:pretty\">In each Google Sheet, go to File → Share → Publish to web. Choose the <b>Transactions<\u002Fb> tab and <b>Comma-separated values (.csv)<\u002Fb>, then paste the link below. The dashboard reloads it every time it opens.<\u002Fp>\n  <\u002Fdiv>\n  <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#6b665c;font-weight:500\">Condo Transactions: CSV link\n    <input value=\"{{ url1 }}\" sc-camel-on-change=\"{{ onUrl1 }}\" placeholder=\"https://docs.google.com/spreadsheets/d/e/…/pub?gid=…&amp;output=csv\" style=\"border:1px solid #e0dbd1;border-radius:8px;padding:10px 12px;font-size:13px;font-family:'IBM Plex Mono',monospace;background:#fff;color:#1d1b17;outline:none\">\n  <\u002Flabel>\n  <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#6b665c;font-weight:500\">Transactions: CSV link (optional)\n    <input value=\"{{ url2 }}\" sc-camel-on-change=\"{{ onUrl2 }}\" placeholder=\"https://docs.google.com/spreadsheets/d/e/…/pub?gid=…&amp;output=csv\" style=\"border:1px solid #e0dbd1;border-radius:8px;padding:10px 12px;font-size:13px;font-family:'IBM Plex Mono',monospace;background:#fff;color:#1d1b17;outline:none\">\n  <\u002Flabel>\n  <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#6b665c;font-weight:500\">Property names (the prefix on your Tiller categories, comma-separated)\n    <input value=\"{{ propsText }}\" sc-camel-on-change=\"{{ onProps }}\" style=\"border:1px solid #e0dbd1;border-radius:8px;padding:10px 12px;font-size:14px;background:#fff;color:#1d1b17;outline:none\">\n  <\u002Flabel>\n  <p style=\"margin:0;font-size:12px;color:#8a8478;line-height:1.6;text-wrap:pretty\">The dashboard keeps rows whose category contains a property name. \"103 Stockton - Rent\" uses Rent as the category. Rows like \"Business Misc - 49 Roosevelt\" get a guessed category you can override. Uncategorized rows are kept only from the Condo Transactions sheet, and only from accounts that also have property transactions. Transfers are ignored.<\u002Fp>\n  <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center\">\n    <button sc-camel-on-click=\"{{ connect }}\" style=\"white-space:nowrap;border:0;background:#1d1b17;color:#f5f3ee;border-radius:999px;padding:10px 20px;font-size:14px;font-weight:500;cursor:pointer\" style-hover=\"background:#3a3730\">Load data<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ useSample }}\" style=\"white-space:nowrap;border:1px solid #e0dbd1;background:#fffdf9;color:#1d1b17;border-radius:999px;padding:10px 18px;font-size:13px;cursor:pointer\">Use sample data<\u002Fbutton>\n    <span style=\"font-size:13px;color:#4a463e\">{{ status }}<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid #e6e1d7;padding-top:18px;display:flex;flex-direction:column;gap:14px\">\n    <div style=\"display:flex;flex-direction:column;gap:4px\">\n      <h3 style=\"margin:0;font-size:15px;font-weight:600\">Sync across devices with Google Sheets<\u002Fh3>\n      <p style=\"margin:0;font-size:13px;color:#4a463e;line-height:1.6;text-wrap:pretty\">Saves your sheet links, category choices and custom categories to a “Dashboard Sync” tab in one of your spreadsheets. Every device connected to it stays up to date automatically.<\u002Fp>\n    <\u002Fdiv>\n    <sc-if value=\"{{ syncNotConnected }}\" hint-placeholder-val=\"{{ true }}\">\n      <ol style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:13px;color:#4a463e;line-height:1.55\">\n        <li>Open your Condo Transactions spreadsheet and go to Extensions → Apps Script.<\u002Fli>\n        <li>Delete what’s there, paste the sync script, and click Save. <span style=\"display:inline-flex;gap:8px;align-items:center\"><button sc-camel-on-click=\"{{ copyScript }}\" style=\"white-space:nowrap;border:1px solid #1d1b17;background:#fffdf9;color:#1d1b17;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer\">Copy script<\u002Fbutton><button sc-camel-on-click=\"{{ toggleScript }}\" style=\"border:0;background:none;padding:0;font-size:12px;color:#6b665c;text-decoration:underline;cursor:pointer\">View<\u002Fbutton><span style=\"font-size:12px;color:#6b665c\">{{ scriptMsg }}<\u002Fspan><\u002Fspan><\u002Fli>\n        <li>Click Deploy → New deployment → gear icon → Web app. Set Execute as <b>Me<\u002Fb> and Who has access <b>Anyone<\u002Fb>, then Deploy and approve the permissions.<\u002Fli>\n        <li>Copy the Web app URL and paste it below. Do this once on each device.<\u002Fli>\n      <\u002Fol>\n      <sc-if value=\"{{ showScript }}\" hint-placeholder-val=\"{{ false }}\">\n        <textarea sc-camel-read-only=\"{{ true }}\" value=\"{{ scriptText }}\" sc-camel-on-focus=\"{{ selectAll }}\" rows=\"10\" style=\"border:1px solid #e0dbd1;border-radius:8px;padding:10px;font-size:11px;font-family:'IBM Plex Mono',monospace;background:#faf8f3;color:#4a463e;resize:vertical\"><\u002Ftextarea>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n    <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#6b665c;font-weight:500\">Web app URL\n      <input value=\"{{ syncUrlVal }}\" sc-camel-on-change=\"{{ onSyncUrl }}\" placeholder=\"https://script.google.com/macros/s/…/exec\" style=\"border:1px solid #e0dbd1;border-radius:8px;padding:10px 12px;font-size:13px;font-family:'IBM Plex Mono',monospace;background:#fff;color:#1d1b17;outline:none\">\n    <\u002Flabel>\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center\">\n      <button sc-camel-on-click=\"{{ connectSync }}\" style=\"white-space:nowrap;border:0;background:#1d1b17;color:#f5f3ee;border-radius:999px;padding:9px 18px;font-size:13px;font-weight:500;cursor:pointer\" style-hover=\"background:#3a3730\">Connect &amp; sync<\u002Fbutton>\n      <sc-if value=\"{{ syncConnected }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ disconnectSync }}\" style=\"white-space:nowrap;border:1px solid #e0dbd1;background:#fffdf9;color:#1d1b17;border-radius:999px;padding:9px 16px;font-size:13px;cursor:pointer\">Disconnect<\u002Fbutton>\n      <\u002Fsc-if>\n      <span style=\"display:flex;align-items:center;gap:6px;font-size:13px;color:#4a463e\"><span style=\"width:8px;height:8px;border-radius:50%;background:{{ syncDot }}\"><\u002Fspan>{{ syncMsg }}<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:12px;color:#8a8478;line-height:1.6;text-wrap:pretty\">Anyone with the Web app URL can read and change your category choices and sheet links. They can't see your other spreadsheet data. Keep the URL private.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid #e6e1d7;padding-top:18px;display:flex;flex-direction:column;gap:12px\">\n    <div style=\"display:flex;flex-direction:column;gap:4px\">\n      <h3 style=\"margin:0;font-size:15px;font-weight:600\">Move your setup to another device<\u002Fh3>\n      <p style=\"margin:0;font-size:13px;color:#4a463e;line-height:1.6;text-wrap:pretty\">Copies your sheet links, category choices and custom categories ({{ overrideCount }}). Send the code to your phone, then paste it below on the phone.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center\">\n      <button sc-camel-on-click=\"{{ doExport }}\" style=\"white-space:nowrap;border:0;background:#1d1b17;color:#f5f3ee;border-radius:999px;padding:9px 18px;font-size:13px;font-weight:500;cursor:pointer\">Copy setup code<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ copyLink }}\" style=\"white-space:nowrap;border:1px solid #e0dbd1;background:#fffdf9;color:#1d1b17;border-radius:999px;padding:9px 16px;font-size:13px;cursor:pointer\">Copy setup link<\u002Fbutton>\n      <span style=\"font-size:13px;color:#4a463e\">{{ exportMsg }}<\u002Fspan>\n    <\u002Fdiv>\n    <sc-if value=\"{{ showExport }}\" hint-placeholder-val=\"{{ false }}\">\n      <textarea sc-camel-read-only=\"{{ true }}\" value=\"{{ exportText }}\" sc-camel-on-focus=\"{{ selectAll }}\" rows=\"3\" style=\"border:1px solid #e0dbd1;border-radius:8px;padding:10px;font-size:11px;font-family:'IBM Plex Mono',monospace;background:#faf8f3;color:#4a463e;resize:vertical;word-break:break-all\"><\u002Ftextarea>\n    <\u002Fsc-if>\n    <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#6b665c;font-weight:500\">Paste a setup code from another device\n      <textarea value=\"{{ importText }}\" sc-camel-on-change=\"{{ onImportText }}\" rows=\"3\" placeholder=\"Paste code here\" style=\"border:1px solid #e0dbd1;border-radius:8px;padding:10px;font-size:12px;font-family:'IBM Plex Mono',monospace;background:#fff;color:#1d1b17;resize:vertical;outline:none\"><\u002Ftextarea>\n    <\u002Flabel>\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center\">\n      <button sc-camel-on-click=\"{{ doImport }}\" style=\"white-space:nowrap;border:1px solid #1d1b17;background:#fffdf9;color:#1d1b17;border-radius:999px;padding:9px 18px;font-size:13px;font-weight:500;cursor:pointer\">Import<\u002Fbutton>\n      <span style=\"font-size:13px;color:#4a463e\">{{ importMsg }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Tabs&quot;,&quot;Single page&quot;],&quot;default&quot;:&quot;Tabs&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nconst SAMPLE_PROPS = ['103 Stockton', '49 Roosevelt'];\nconst CAP_RE = /improv|capital|renovat|remodel|addition|new roof|replacement/i;\nconst isCap = t => t.amount < 0 && CAP_RE.test(t.cat);\nconst SYNC_SCRIPT = \"// Rental Dashboard sync. Saves your dashboard choices to a \\\"Dashboard Sync\\\" tab.\\nconst TAB = 'Dashboard Sync';\\nfunction sheet_() {\\n  const ss = SpreadsheetApp.getActive();\\n  return ss.getSheetByName(TAB) || ss.insertSheet(TAB);\\n}\\nfunction doGet() {\\n  const sh = sheet_(), n = sh.getLastRow();\\n  const json = n ? sh.getRange(1, 1, n, 1).getValues().map(r => r[0]).join('') : '';\\n  return ContentService.createTextOutput(json || '{}').setMimeType(ContentService.MimeType.JSON);\\n}\\nfunction doPost(e) {\\n  const lock = LockService.getScriptLock(); lock.waitLock(10000);\\n  try {\\n    const body = e.postData.contents; JSON.parse(body);\\n    const sh = sheet_(); sh.getRange('A:A').clearContent();\\n    const parts = body.match(/[\\\\s\\\\S]{1,40000}/g) || ['{}'];\\n    sh.getRange(1, 1, parts.length, 1).setNumberFormat('@').setValues(parts.map(p => [p]));\\n    return ContentService.createTextOutput('{\\\"ok\\\":true}').setMimeType(ContentService.MimeType.JSON);\\n  } finally { lock.releaseLock(); }\\n}\";\nconst schedOf = t => { if (!t.prop) return ''; if (isCap(t)) return 'Capital improvement (Form 4562)'; const i = TAX_MAP.findIndex(([, , re, inc]) => (inc ? t.amount > 0 : t.amount < 0) && re.test(t.cat)); return i < 0 ? '' : 'Line ' + TAX_MAP[i][0] + ' ' + TAX_MAP[i][1]; };\nconst csvCell = v => { v = v == null ? '' : String(v); return /[\",\\n]/.test(v) ? '\"' + v.replace(/\"/g, '\"\"') + '\"' : v; };\nconst TAX_MAP = [\n  ['3', 'Rents received', /rent|income/i, 1],\n  ['7', 'Cleaning & maintenance', /clean|maint|landscap|lawn|snow/i],\n  ['9', 'Insurance', /insur/i],\n  ['11', 'Management fees', /manage/i],\n  ['12', 'Mortgage (payments, see note)', /mortgage|interest/i],\n  ['14', 'Repairs', /repair/i],\n  ['15', 'Supplies', /suppl/i],\n  ['16', 'Taxes', /tax/i],\n  ['17', 'Utilities', /utilit|water|electric|gas|sewer|trash/i],\n  ['19', 'Other (HOA, fees, misc.)', /.*/],\n];\nfunction rng(s) { return () => (s = (s * 16807) % 2147483647) / 2147483647; }\nfunction sampleData() {\n  const r = rng(11), out = [], P = SAMPLE_PROPS;\n  const fix = ['Plumbing repair', 'Appliance repair', 'Handyman', 'Paint & supplies', 'HVAC service'];\n  for (let m = 0; m < 36; m++) {\n    const y = 2023 + Math.floor((9 + m) / 12), mo = (9 + m) % 12;\n    const d = day => `${y}-${String(mo + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;\n    const add = (day, desc, prop, cat, amt) => out.push({ date: d(day), desc, prop, cat, amount: Math.round(amt * 100) / 100, account: 'Rental Checking' });\n    add(1, 'Zelle from tenant', P[0], 'Rent', y < 2025 ? 1600 : 1650);\n    add(15, 'Mortgage payment', P[0], 'Mortgage', -1078.61);\n    add(8, 'City utilities', P[0], 'Utilities', -(55 + r() * 45));\n    if (m !== 20) add(3, 'Tenant ACH deposit', P[1], 'Rent', (y > 2025 || (y === 2025 && mo >= 5)) ? 4350 : 4200);\n    add(1, 'Mortgage payment', P[1], 'Mortgage', -3823.79);\n    add(11, 'Electric & water', P[1], 'Utilities', -(360 + r() * 190));\n    add(5, 'HOA dues', P[1], 'HOA', -425);\n    if (mo === 2) { add(20, 'Landlord policy', P[0], 'Insurance', -1140); add(20, 'Landlord policy', P[1], 'Insurance', -2280); }\n    if (mo === 3 || mo === 9) { add(28, 'County property tax', P[0], 'Property Tax', -1450); add(28, 'County property tax', P[1], 'Property Tax', -3900); }\n    if (r() < 0.35) add(18, fix[Math.floor(r() * fix.length)], P[r() < 0.5 ? 0 : 1], 'Repairs', -(150 + r() * 1100));\n    if (r() < 0.3) out.push({ date: d(22), desc: 'HOME DEPOT #4411', prop: '', cat: 'Uncategorized', amount: -Math.round((40 + r() * 320) * 100) / 100, account: 'Rental Checking' });\n  }\n  return applyGuesses(out.filter(t => t.date <= '2026-09-24').map(t => t.prop === P[0] && t.date < '2024-10' ? { ...t, cat: '', needsDetail: true, source: 'Transactions' } : t));\n}\nconst DEFAULT_CATS = ['Rent', 'Mortgage', 'Utilities', 'HOA', 'Insurance', 'Property Tax', 'Repairs', 'Other'];\nconst RULES = [\n  ['Mortgage', /mortgage|home loan|loan pmt|mr\\.? ?cooper|rocket|servic|lakeview|home lending/i],\n  ['HOA', /\\bhoa\\b|association|assn|condo/i],\n  ['Insurance', /insur|allstate|state farm|geico|progressive|liberty mut|travelers/i],\n  ['Property Tax', /tax|county|treasurer|township|borough/i],\n  ['Utilities', /electric|water|gas|sewer|utilit|power|energy|comcast|xfinity|verizon|trash|pse|con ?ed|duke|pg&e/i],\n  ['Repairs', /home depot|lowe'?s|plumb|repair|hvac|handyman|hardware|menards|appliance|paint/i],\n];\nconst normDesc = s => (s || '').toLowerCase().replace(/[#\\d*]+/g, ' ').replace(/[^a-z& ]/g, ' ').replace(/\\s+/g, ' ').trim().split(' ').slice(0, 3).join(' ');\nfunction applyGuesses(rows) {\n  const byDesc = {}, byAmt = {};\n  rows.filter(t => t.prop && !t.needsDetail).forEach(t => {\n    const dk = t.prop + '|' + normDesc(t.desc), ak = t.prop + '|' + Math.abs(t.amount).toFixed(2);\n    (byDesc[dk] = byDesc[dk] || {})[t.cat] = (byDesc[dk][t.cat] || 0) + 1;\n    (byAmt[ak] = byAmt[ak] || {})[t.cat] = (byAmt[ak][t.cat] || 0) + 1;\n  });\n  const top = o => o && Object.entries(o).sort((a, b) => b[1] - a[1])[0][0];\n  return rows.map(t => {\n    if (!t.needsDetail) return t;\n    const key = t.prop + '|' + normDesc(t.desc);\n    let guess, why;\n    if ((guess = top(byDesc[key]))) why = 'matches Condo sheet description';\n    else if ((guess = top(byAmt[t.prop + '|' + Math.abs(t.amount).toFixed(2)]))) why = 'matches Condo sheet amount';\n    else if (t.amount > 0) { guess = 'Rent'; why = 'deposit'; }\n    else { const r = RULES.find(([, re]) => re.test(t.desc)); guess = r ? r[0] : 'Other'; why = r ? 'keyword in description' : 'no match'; }\n    return { ...t, guess, why, okey: key };\n  });\n}\nfunction parseCSV(text) {\n  const rows = []; let row = [], f = '', q = false;\n  for (let i = 0; i < text.length; i++) {\n    const c = text[i];\n    if (q) { if (c === '\"') { if (text[i + 1] === '\"') { f += '\"'; i++; } else q = false; } else f += c; }\n    else if (c === '\"') q = true;\n    else if (c === ',') { row.push(f); f = ''; }\n    else if (c === '\\n' || c === '\\r') { if (c === '\\r' && text[i + 1] === '\\n') i++; row.push(f); rows.push(row); row = []; f = ''; }\n    else f += c;\n  }\n  if (f || row.length) { row.push(f); rows.push(row); }\n  return rows;\n}\nfunction toISO(s) {\n  s = (s || '').trim(); let m = s.match(/^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{2,4})$/);\n  if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`; }\n  m = s.match(/^(\\d{4})-(\\d{1,2})-(\\d{1,2})/); if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;\n  const dt = new Date(s); return isNaN(dt) ? '' : dt.toISOString().slice(0, 10);\n}\nfunction tillerRows(text, props, allowUncat) {\n  const rows = parseCSV(text); const hi = rows.findIndex(r => r.some(c => c.trim().toLowerCase() === 'date') && r.some(c => c.trim().toLowerCase() === 'amount'));\n  if (hi < 0) throw new Error('No Date/Amount header found. Publish the Transactions tab.');\n  const h = rows[hi].map(c => c.trim().toLowerCase()), ix = n => h.indexOf(n);\n  const I = { date: ix('date'), desc: ix('description'), full: ix('full descripti
